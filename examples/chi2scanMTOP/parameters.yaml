Minimizer: MINUIT
MINUIT:
  Commands: |
    set str 2
    call fcn 3

Evolutions:
  proton-LHAPDF:
    class: LHAPDF
    set: "MMHT2014nnlo68cl"
    member: 0

DefaultEvolution: proton-LHAPDF

# QCD parameters
Order: NNLO
NFlavour: 5
isFFNS: 0
Q0 : 1.378404875209 # Initial scale =sqrt(1.9)
alphas : 0.118

? !include constants.yaml



byReaction:
  Hathor:
     ? !include reactions/Hathor.yaml
     MS_MASS: 1

OutputDirectory: "output" #Can be omitted, default is "output"
