Minimizer: MINUIT
MINUIT:
  doErrors: Hesse
  Commands: |
    set str 2
    migrad 20000
    hesse
    call fcn 3

Parameters:
  Adbar: [ 0.044040, 0.005673 ]
  Agp: [ -0.405643, 1.075900 ]
  Bdbar: [ -0.283335, 0.007278 ]
  Bdv: [ 0.698172, 0.095362 ]
  Bg: [ -0.433265, 0.195280 ]
  Bgp: [ -0.205270, 0.068110 ]
  Buv: [ 0.589744, 0.039467 ]
  Cdbar: [ 13.433331, 1.444100 ]
  Cdv: [ 2.900795, 0.384330 ]
  Cg: [ 1.950263, 1.147700 ]
  Cubar: [ 4.300600, 0.816830 ]
  Cuv: [ 3.817335, 0.088934 ]
  Dubar: [ 6.164092, 3.245400 ]
  Euv: [ 16.695164, 2.402400 ]
  Ag   :  DEPENDENT
  Auv  :  DEPENDENT
  Duv  : [    0     ]
  Adv  :  DEPENDENT
  ZERO : [ 0. ]          # zero
  Cgp  : [ 25.0, 0.]  # fix C of negative gluon
  fs : [ 0.4, 0.0 ]

Parameterisations:
  par_uv:
    class: HERAPDF
    parameters: [Auv,Buv,Cuv,Duv,Euv]
  par_dv:
    class: HERAPDF
    parameters: [Adv,Bdv,Cdv]
  par_ubar:
    class: HERAPDF
    parameters: [Adbar,Bdbar,Cubar,Dubar]
  par_dbar:
    class: HERAPDF
    parameters: [Adbar,Bdbar,Cdbar]
  par_s:
    #class: HERAPDF
    #parameters: [As,Bs,Cs]
    # parametrise as expression: otherwise how to parametrise it as fs/(1-fs)*par_dbar using HERAPDF?
    class: Expression
    expression: "Adbar*fs/(1-fs)*(x^Bdbar*(1-x)^Cdbar)"
  par_g:
    class: NegativeGluon
    parameters: [Ag,Bg,Cg,ZERO,ZERO,Agp,Bgp,Cgp]

DefaultDecomposition: proton
Decompositions:
  proton:
    class: UvDvUbarDbarS
    xuv: par_uv
    xdv: par_dv
    xubar: par_ubar
    xdbar: par_dbar
    xs: par_s
    xg: par_g

DefaultEvolution: proton-APFELxx

Evolutions:
  proton-APFELxx:
    ? !include evolutions/APFELxx.yaml
    decomposition: proton

# QCD parameters
Order: NLO
NFlavour: 5
isFFNS: 0
Q0 : 1.378404875209 # Initial scale =sqrt(1.9)
alphas : 0.118

? !include constants.yaml



byReaction:
  N3LO_DISCC:
    ? !include reactions/N3LO_DISCC.yaml
  N3LO_DISNC:
    ? !include reactions/N3LO_DISNC.yaml

# Specify HF scheme used for DIS NC processes:
hf_scheme_DISNC :
  defaultValue : 'N3LO_DISNC'     # global specification

# Specify HF scheme used for DIS CC processes:
hf_scheme_DISCC :
  defaultValue : 'N3LO_DISCC'     # global specification

WriteLHAPDF6:
  name: "proton"
  description: "..."
  authors: "..."
  reference: "..."
    # use DefaultEvolution
  #evolution: proton-QCDNUM
    # take internal grid
  preferInternalGrid:
    # or define grid
  #Xrange: [1e-4, 1]
  #Qrange: [1,1000]
  #Xnpoints: 200
  #Qnpoints: 120

FactorisationScheme: Krk
