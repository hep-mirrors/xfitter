Parameterisations:
  par_uv:
    class: Expression
    expression: "ABM_uv_A*x^(ABM_uv_a+ABM_uv_g1*x+ABM_uv_g2*x^2+ABM_uv_g3*x^3)*(1-x)^ABM_uv_b"
  par_dv:
    class: Expression
    expression: "ABM_dv_A*x^(ABM_dv_a+ABM_dv_g1*x+ABM_dv_g2*x^2+ABM_dv_g3*x^3)*(1-x)^ABM_dv_b"
  par_ubar:
    class: Expression
    expression: "ABM_us_A*x^(ABM_us_a*(1+ABM_us_gm1*ln(x))*(1+ABM_us_g1*x))*(1-x)^ABM_us_b"
  par_dbar:
    class: Expression
    expression: "ABM_ds_A*x^(ABM_ds_a*(1+ABM_ds_g1*x))*(1-x)^ABM_ds_b"
  par_s:
    class: Expression
    expression: "ABM_ss_A*x^ABM_ss_a*(1-x)^ABM_ss_b"
  par_sbar:
    class: Expression
    expression: "ABM_ss_A*x^ABM_ss_a*(1-x)^ABM_ss_b"
  par_g:
    class: Expression
    expression: "ABM_g_A*x^(ABM_g_a*(1+ABM_g_g1*x))*(1-x)^ABM_g_b"
