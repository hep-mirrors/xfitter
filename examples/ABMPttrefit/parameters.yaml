  "Charm cross section H1-ZEUS combined":
     tmc: 0
  "Beauty cross section ZEUS Vertex":
     tmc: 0
  "H1 F2 Beauty Vertex":
     tmc: 0
  # normalize some data sets
  "BCDMS F2p 100GeV":
     DATANORM: N_BCDMS
  "BCDMS F2p 120GeV":
     DATANORM: N_BCDMS
  "BCDMS F2p 200GeV":
     DATANORM: N_BCDMS
  "BCDMS F2p 280GeV":
     DATANORM: N_BCDMS
  "NMC F2p 90 GeV":
     DATANORM: N_NMC90
  "NMC F2p 120 GeV":
     DATANORM: N_NMC120
  "NMC F2p 200 GeV":
     DATANORM: N_NMC200
  "NMC F2p 280 GeV":
     DATANORM: N_NMC280
  "SLAC 49a":
     DATANORM: N_SLAC49a
  "SLAC 49b":
     DATANORM: N_SLAC49b
  "SLAC 87":
     DATANORM: N_SLAC87
  "SLAC 89b":
     DATANORM: N_SLAC89b
  "NuTeV charm neutrino":
     #Order: NLO
     tmc: 0
     group_parallel: "nucleon"
  "NuTeV charm antineutrino":
     #Order: NLO
     tmc: 0
     group_parallel: "nucleon"
  "CCFR charm neutrino":
     #Order: NLO
     tmc: 0
     group_parallel: "nucleon"
  "CCFR charm antineutrino":
     #Order: NLO
     tmc: 0
     group_parallel: "nucleon"
  "NOMAD charm nu dsigma/dE":
     group_parallel: "nucleon_integrated"
  "NOMAD charm nu dsigma/dx":
     group_parallel: "nucleon_integrated"
  "NOMAD charm nu dsigma/dsqrtshat":
     group_parallel: "nucleon_integrated"
  "CHORUS charm":
     group_parallel: "nucleon_integrated"
  # rescale ATLAS 2010 W,Z data according to lumi update (see 1302.4393)
  "ATLAS W+ lepton pseudorapidity, 2010 data":
     DATANORM: N_ATLAS7WZ
  "ATLAS W- lepton pseudorapidity, 2010 data":
     DATANORM: N_ATLAS7WZ
  "ATLAS Z rapidity, 2010 data":
     DATANORM: N_ATLAS7WZ

