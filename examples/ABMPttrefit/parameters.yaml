DefaultDecomposition: proton-param
Decompositions:
  proton-param:
    class: UvDvUbarDbarS
    xuv: par_uv
    xdv: par_dv
    xubar: par_ubar
    xdbar: par_dbar
    xs: par_s
    xg: par_g
  proton-start:
    class: FromEvolution
    Q0 : "Q0_start"
    evolution : "proton-nf3"
DefaultEvolution: proton-nf5
Evolutions:
  proton-nf3:
    ? !include evolutions/APFELxx.yaml
    Q0 : "Q0_param"
    decomposition: proton-param
    alphas_Q0 : "Q0_start"
    alphas : "alphas_Q0_start"
    isFFNS : 1
    NFlavour : 3
    QGrid : [200, 0.8944, 15000.1, 3]
    xGrid : [[100, 1e-07, 3], [60, 0.1, 3], [50, 0.6, 3], [50, 0.8, 3]]
  proton-nf5:
    ? !include evolutions/APFELxx.yaml
    Q0 : "Q0_start"
    decomposition: proton-start
    alphas_Q0 : "Q0_start"
    alphas : "alphas_Q0_start"
    isFFNS : 0
    NFlavour : 5
    heavyQuarkMassScheme : MSBar
    restart_at_each_iteration : 1
    QGrid : [200, 0.8944, 15000.1, 3]
    xGrid : [[100, 1e-07, 3], [60, 0.1, 3], [50, 0.6, 3], [50, 0.8, 3]]
  nucleon_nf3:
    input: proton-nf3
    class: FlipUD
    flip: 0.5
  antiproton:
    class: FlipCharge
  nucleon:
    class: FlipUD
    flip: 0.5
  nucleon_Cu63:
    class: FlipUD
    flip: 0.53968254 # 34/63

Order: NNLO
NFlavour: 5
isFFNS: 1
Q0_param : 3.0 # =sqrt(9)
Q0_start : 0.894427 # =sqrt(0.8) for alphaS and PDF evolution (should be below m_c, this value is from LHAPDF grids)
N_ATLAS7WZ : 1.019
# HT
ht_x: 0.,0.1,0.3,0.5,0.7,0.9,1.
ht_vals_f2: ht_f2_1,ht_f2_2,ht_f2_3,ht_f2_4,ht_f2_5,ht_f2_6,ht_f2_7
ht_vals_ft: ht_ft_1,ht_ft_2,ht_ft_3,ht_ft_4,ht_ft_5,ht_ft_6,ht_ft_7
ht_val_alpha_f2: ht_alpha_f2
ht_val_alpha_ft: ht_alpha_ft
#
? !include constants.yaml

byReaction:
  FFABM_DISNC:
    ? !include reactions/FFABM_DISNC.yaml
    evolution: proton-nf3
    runm: 1
    ordfl: 1
    hqnons: 0
    ht: 1
    tmc: "l"
    q2mincomp: 2.498
    #threads : 1
  FFABM_DISCC:
    ? !include reactions/FFABM_DISCC.yaml
    evolution: proton-nf3
    runm: 1
    ordfl: 1
    hqnons: 0
    ht: 1
    ht_val_scale: 0.5
    ht_vals_f2: htns_f2_1,htns_f2_2,htns_f2_3,htns_f2_4,htns_f2_5,htns_f2_6,htns_f2_7
    ht_vals_ft: htns_ft_1,htns_ft_2,htns_ft_3,htns_ft_4,htns_ft_5,htns_ft_6,htns_ft_7
    ht_vals_f3: htns_f3_1,htns_f3_2,htns_f3_3,htns_f3_4,htns_f3_5,htns_f3_6,htns_f3_7
    ht_val_alpha_f2: htns_alpha_f2
    ht_val_alpha_ft: htns_alpha_ft
    tmc: "l"
    tmc_f3: 1
    #threads : 1
  Hathor:
    ? !include reactions/Hathor.yaml
    MS_MASS: 1
    muR: 1.
    muF: 1.
    precisionLevel: 3
    integrator: sd2
  HathorSingleTop:
    ? !include reactions/HathorSingleTop.yaml
    MS_MASS: 1
    muR: 1
    muF: 1
    precisionLevel: 3
    integrator: sd2
    alphaem: 0.0075623956 # 1. / 132.2332298
    sin2thW: 0.2228972
  PineAPPL:
    ? !include reactions/PineAPPL.yaml
  KFactor:
    MSBAR_to_pole: mtFit
# Specify HF scheme used for DIS NC processes:
hf_scheme_DISNC :
  defaultValue : 'FFABM_DISNC'

# Specify HF scheme used for DIS CC processes:
hf_scheme_DISCC :
  defaultValue : 'FFABM_DISCC'     # global specification

