  runm: 1 # 0 for pole mass (default); 1 for MSbar running mass
  ordfl: 1 # 1 for O(alpha_S) in F_L = O(alpha_S) + 1 in F_2 (default); 0 for O(alpha_S) in F_L = O(alpha_S) in F_2
  OrderHQ: '' # same as Order
  scalea1: 1.0 # scale for heavy quarks mu^2 = scalea1 * Q^2 + scaleb1 * 4 * m_h^2
  scaleb1: 1.0
  xbmin: 5e-6
  xbmax: 0.999
  q2mincomp: 1.0
  scalesemilepbr: 0 # 1 for charm CC muon final state to be scaled with 1 / (br0 / (1 + br1 / E(nu)))
  integrator: sd2 # alternative cuba, but need to comment out and recompile
  integrator_epsrel: 1e-2 # good for sd2 (3e-2 is good for cuba)
  integrator_verbose: 0
  group_parallel: default
  parallel_task_distribution: chunky
